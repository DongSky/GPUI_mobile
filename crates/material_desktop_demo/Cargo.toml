[package]
name = "material_desktop_demo"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Desktop GPUI catalog that paints gpui_material::resolve() appearances."

[[bin]]
name = "material_desktop_demo"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_material.workspace = true
lyon.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
# Workspace gpui is default-features=false so Android stays lean. Desktop must
# re-enable these or `gpui::guess_compositor()` ignores DISPLAY and goes headless.
gpui = { workspace = true, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
