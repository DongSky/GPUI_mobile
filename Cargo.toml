[workspace]
resolver = "2"
members = [
    "crates/gpui_android",
    "crates/hello_gpui",
    "crates/component_demo",
    "crates/gpui_material",
]

[workspace.dependencies]
# Unpinned git source; Cargo.lock holds the Zed commit (a8fafdd).
gpui = { git = "https://github.com/zed-industries/zed", default-features = false }
gpui_wgpu = { git = "https://github.com/zed-industries/zed" }
anyhow = "1"
log = "0.4"
flume = "0.12"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
raw-window-handle = "0.6"
# ndk 版本必须与 android-activity 0.6 内部使用的一致（0.9），否则出现两个 NativeWindow 类型
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = "0.9"
android_logger = "0.14"

gpui_android = { path = "crates/gpui_android" }
gpui_material = { path = "crates/gpui_material" }
