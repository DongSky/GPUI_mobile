[workspace]
resolver = "2"
members = [
    "crates/gpui_android",
    "crates/hello_gpui",
    "crates/component_demo",
    "crates/gpui_material",
    "crates/material_desktop_demo",
]

[workspace.dependencies]
# Pin every Zed crate to the same lockfile commit. An unpinned second crate
# (gpui_platform) would otherwise float the whole git source to origin/HEAD.
gpui = { git = "https://github.com/zed-industries/zed", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74" }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74" }
anyhow = "1"
log = "0.4"
flume = "0.12"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
raw-window-handle = "0.6"
# ndk 版本必须与 android-activity 0.6 内部使用的一致（0.9），否则出现两个 NativeWindow 类型
lyon = "1.0.19"
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = "0.9"
android_logger = "0.14"

gpui_android = { path = "crates/gpui_android" }
gpui_material = { path = "crates/gpui_material" }
